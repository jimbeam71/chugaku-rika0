<style>
/* 配置: 1カラムのカード縦並び。各カード = 種類タグ → 裏技(大きい文字) → 図 → ただし → 練習1問 */
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#14213d; --sub:#4a5878; --line:#c9d1e0;
  --stamp:#d62839; --hi:#ffd23f; --hi-ink:#14213d; --ok:#1f8a4c; --ng:#d62839; --soft:#e4e9f3;
  --f-disp:'Dela Gothic One','Zen Maru Gothic',sans-serif; --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151f; --card:#19202e; --ink:#eef1f8; --sub:#a4b0c8; --line:#2c3750;
  --stamp:#ff6b78; --hi:#f2c230; --hi-ink:#14213d; --ok:#4cc884; --ng:#ff6b78; --soft:#222c40; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151f; --card:#19202e; --ink:#eef1f8; --sub:#a4b0c8; --line:#2c3750;
  --stamp:#ff6b78; --hi:#f2c230; --hi-ink:#14213d; --ok:#4cc884; --ng:#ff6b78; --soft:#222c40; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:17px;line-height:1.75;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--f-disp);font-weight:400;text-wrap:balance;margin:0;line-height:1.35}
header{display:flex;flex-direction:column;gap:12px;padding-block:8px}
.lv{align-self:flex-start;font-family:var(--f-disp);font-size:13px;letter-spacing:.12em;border:2px solid var(--stamp);color:var(--stamp);padding:2px 10px;border-radius:4px;transform:rotate(-3deg)}
h1{font-size:30px}
h1 mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit}
.lead{margin:0;color:var(--sub)}
.rule{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;color:var(--sub);margin:0}
.rule b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
.tag{background:var(--stamp);color:#fff;padding:1px 10px;border-radius:99px;font-weight:700}
.eff{margin-left:auto;font-weight:700}
.eff i{font-style:normal;color:var(--stamp)}
h2{font-size:20px}
.trick{font-size:20px;font-weight:900;line-height:1.7;margin:0}
.trick mark{background:var(--hi);color:var(--hi-ink);padding:1px 6px;border-radius:4px}
.sub{margin:0;font-size:15px;color:var(--sub)}
.fig{background:var(--soft);border-radius:10px;padding:12px;overflow-x:auto}
.fig svg{display:block;margin-inline:auto;max-width:100%;height:auto}
.fig text{fill:var(--ink);font-family:var(--f-body);font-weight:700}
.warn{border-left:4px solid var(--pink);padding:2px 0 2px 12px;font-size:15px;margin:0}
.warn b{color:var(--stamp)}
:root{--pink:#ff9fcd;--pink-ink:#14213d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pink:#ff86bd}}
:root[data-theme="dark"]{--pink:#ff86bd}
.pk,.warn > b:first-child{background:var(--pink);color:var(--pink-ink);padding:1px 6px;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:var(--soft)}
tr.hl td{background:var(--hi);color:var(--hi-ink);font-weight:900}
.bars{display:flex;flex-direction:column;gap:6px;font-size:14px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3.5em;align-items:center;gap:8px}
.bar span.t{height:18px;border-radius:4px;background:var(--stamp);display:block}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.quiz{border-top:2px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.quiz .qt{font-family:var(--f-disp);font-size:13px;color:var(--stamp);letter-spacing:.1em}
.quiz p{margin:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;font-weight:700;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:48px}
.opt:hover{border-color:var(--sub)}
.opt:focus-visible,.again:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 14%,var(--card))}
.opt:disabled{cursor:default}
.opt svg{vertical-align:middle;margin-right:12px}
.figttl{font-size:14px;font-weight:700;margin:0 0 -6px;color:var(--sub)}
.sub mark{background:var(--hi);color:var(--hi-ink);padding:1px 6px;border-radius:4px}
.exbox{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.exbox b{font-family:var(--f-disp);font-weight:400;color:var(--stamp);font-size:13px;letter-spacing:.08em}
.exbox p{margin:0}
.exbox .a{color:var(--stamp);font-weight:900}
.nav{display:flex;flex-wrap:wrap;gap:6px}
.nav a{font-size:13px;font-weight:700;color:var(--ink);background:var(--soft);padding:3px 10px;border-radius:99px;text-decoration:none}
.nav a:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.skit{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:15px;display:flex;flex-direction:column;gap:8px}
.skit > b{font-family:var(--f-disp);font-weight:400;color:var(--stamp);font-size:13px;letter-spacing:.08em}
.skit p{margin:0}
.skit .who{display:inline-block;min-width:3em;font-weight:900;color:var(--sub)}
.wv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;text-align:center;font-weight:700;min-width:0}
.wc svg{width:100%;max-width:150px;height:auto}
.chal{border:2px solid var(--stamp)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:700;font-variant-numeric:tabular-nums}
.prog{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--stamp);border-radius:99px}
.cq{margin:0;font-size:18px;font-weight:700}
.cq:focus,.big:focus{outline:none}
.big{font-family:var(--f-disp);font-size:44px;line-height:1.2;margin:0;font-variant-numeric:tabular-nums}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.go{font-family:var(--f-disp);font-size:17px;background:var(--stamp);color:var(--card);border:none;border-radius:12px;padding:12px 22px;cursor:pointer;min-height:48px}
.btn2{font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 16px;cursor:pointer;min-height:48px}
.go:focus-visible,.btn2:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.misslist{display:flex;flex-direction:column;gap:6px;padding:0;margin:6px 0 0;list-style:none;font-size:15px}
.misslist a{color:var(--ink);font-weight:700}
.nav a.chip{background:var(--stamp);color:var(--card)}
.ans{font-size:16px;background:var(--soft);border-radius:10px;padding:10px 14px}
.ans .v{font-family:var(--f-disp);font-size:17px}
.ans .v.ok{color:var(--ok)} .ans .v.ng{color:var(--ng)}
.again{align-self:flex-start;font:inherit;font-weight:700;font-size:14px;background:none;border:none;color:var(--sub);text-decoration:underline;cursor:pointer;padding:6px 0}
footer{color:var(--sub);font-size:14px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:stretch}
.back{align-self:flex-start;font-size:14px;font-weight:700;color:var(--sub);text-decoration:none;border-bottom:2px solid var(--line)}
.next{display:block;font-family:var(--f-disp);font-size:18px;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:12px;text-decoration:none}
.back:focus-visible,.next:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
</style>
</head>

<script>
const FP='M0 0H34V10H10V25H28V35H10V60H0Z';
function fsvg(sx,sy){return `<svg width="40" height="50" viewBox="-22 -34 44 68" aria-hidden="true"><path d="${FP}" fill="currentColor" transform="scale(${sx},${sy}) translate(-17,-30)"/></svg>`}
function gsvg(show){
  const lab = show ? `<text x="130" y="162" font-size="13" text-anchor="middle" style="fill:var(--stamp)">とけている最中</text>

  <line x1="100" y1="140" x2="160" y2="140" stroke="var(--stamp)" stroke-width="6" stroke-linecap="round"/>
  <line x1="205" y1="50" x2="255" y2="50" stroke="var(--stamp)" stroke-width="6" stroke-linecap="round"/>

function wave(a,c){const p=[];for(let i=0;i<=140;i+=2){p.push((5+i)+','+(40-a*Math.sin(2*Math.PI*c*i/140)).toFixed(1));}
  return `<svg viewBox="0 0 150 80" width="150" aria-hidden="true"><line x1="5" y1="40" x2="145" y2="40" stroke="var(--line)" stroke-width="1.5"/><polyline points="${p.join(' ')}" fill="none" stroke="var(--stamp)" stroke-width="2.5" stroke-linejoin="round"/></svg>`;}
function wcell(a,c,cap){return `<div class="wc">${wave(a,c)}<span>${cap}</span></div>`;}
const T = [
{
  tag:'決め打ち', eff:3, title:'「〜の関係は？」と聞かれたら',
  trick:'とりあえず<mark>比例</mark>と書く',
  fig:`<svg viewBox="0 0 300 170" width="300" role="img" aria-label="原点を通る右上がりの直線のグラフ">

    <line x1="40" y1="140" x2="260" y2="30" stroke="var(--stamp)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="40" cy="140" r="7" fill="var(--hi)" stroke="var(--stamp)" stroke-width="3"/>
    <text x="52" y="162" font-size="14">原点(0,0)</text>
    <text x="150" y="70" font-size="15" transform="rotate(-27 150 70)">まっすぐ・原点を通る = 比例</text></svg>`,
  warn:'<b>ただし：</b>文に「一方が大きくなると、もう一方は小さくなる」と書いてあったら<b>反比例</b>。それ以外は、まず比例。',
  q:{t:'電熱線の電圧を2倍にすると、流れる電流は2倍になった。電圧と電流はどんな関係？',o:['比例','反比例','関係ない'],a:0,
     why:'ばねの「おもりの重さとのび」、同じ物質の「体積と質量」、地震の「震源までの距離と、初期微動が続く時間」も、みんな比例だよ。'}
},
{
  tag:'決め打ち', eff:3, title:'とけ方・結晶の問題で、物質名を選ぶとき',
  trick:'<mark>硝酸カリウム</mark> ＞ <mark>みょうばん</mark> ＞ 食塩<br>左にあるものが答え',
  fig:`<div class="bars" aria-label="60℃から20℃に冷やしたとき、出てくる結晶の量">
    <div style="font-size:13px;color:var(--sub)">水100gを60℃→20℃に冷やしたとき出る結晶(g)</div>
    <div class="bar"><span>硝酸カリウム</span><span class="t" style="width:100%"></span><b>77</b></div>
    <div class="bar"><span>みょうばん</span><span class="t" style="width:60%"></span><b>46</b></div>
    <div class="bar"><span>食塩</span><span class="t" style="width:2%;min-width:3px"></span><b>1</b></div></div>`,
  warn:'<b>ただし：</b>「温度を下げても、ほとんど結晶が出ない物質は？」と聞かれたら答えは<b>食塩</b>。ここだけ逆になる。',
  q:{t:'水100gに物質をとかし、60℃から20℃まで冷やす。いちばん多く結晶が出るのは？',
     html:`<table><tr><th>水100gにとける量</th><th>20℃</th><th>60℃</th></tr>
       <tr><td>食塩</td><td>36g</td><td>37g</td></tr>
       <tr><td>みょうばん</td><td>11g</td><td>57g</td></tr>
       <tr><td>硝酸カリウム</td><td>32g</td><td>109g</td></tr></table>`,
     o:['食塩','みょうばん','硝酸カリウム'],a:2,
     why:'60℃と20℃の差が大きいほど、たくさん出る。硝酸カリウムは109−32＝77g、みょうばんは57−11＝46g、食塩は1g。'}
},
{
  tag:'消去法', eff:2, title:'「正しいものを選べ」で迷ったら',

    <text x="75" y="42" font-size="18" text-anchor="middle">すべて・必ず</text>
    <text x="150" y="42" font-size="30" style="fill:var(--stamp)">×</text>

    <text x="150" y="98" font-size="30" style="fill:var(--ok)">○</text></svg>`,
  warn:'<b>ただし：</b>教科書の決まりごとなら「必ず」でも正しいことがある。つかうのは<b>2択でどっちか迷ったとき</b>だけ。',
  q:{t:'正しい文はどっち？',o:['ア　金属はすべて磁石につく','イ　金属は電気をよく通す'],a:1,
     why:'アには「すべて」が入っている。銅やアルミニウムは金属だけど磁石につかない。だからアは×、イが○。'}
},
{
  tag:'語呂合わせ', eff:3, title:'高気圧と低気圧',
  trick:'<mark>高血圧</mark>＝下げればハッピー日本晴れ<br>高気圧 ＝ 下降気流 ＝ 晴れ',

  fig:`<svg viewBox="0 0 330 150" width="330" role="img" aria-label="高気圧は空気が下がって晴れ、低気圧は空気が上がって雨">

  q:{t:'高気圧の中心付近では、空気はどう動く？ 天気は？',o:['下降気流で、晴れる','上昇気流で、雨になる'],a:0,

{

    <text x="316" y="24" font-size="18" text-anchor="end">東</text>

    <tr><td>有性生殖</td><td>種子（受粉・受精）、動物の卵と精子</td><td>ちがうこともある</td></tr></table>`,
  ex:[['ジャガイモのいもを植えてできた子の形質は？','親と同じ'],
      ['ジャガイモの種子から育てた子は？','親と同じとは限らない（受精しているから）'],
      ['受精しないでふえる生殖を何という？','無性生殖']],
  warn:'<b>ただし：</b>無性生殖は、ジャガイモだけじゃない。サツマイモ・イチゴ（ほふく茎）・挿し木、ゾウリムシやアメーバの分裂、ヒドラの出芽もそう。「受精しない」と書いてあれば無性生殖。',
  q:{t:'ジャガイモのいもを植えて、新しい個体をふやした。できた個体の形質は、もとの親と比べてどうなる？',o:['親と同じ','親と全くちがう','半分は親と同じ'],a:0,
     why:'いもでふやすのは無性生殖。受精がないので、親と同じ形質になる。'}
}
];

const SHORT=['比例','溶解度','必ず・すべて','高気圧','低気圧の動き','BTB液','フェノールフタレイン','塩化コバルト紙','気体の見分け','金属と塩酸','においの気体','気体の集め方','加熱の色','黒い粉末','レンズ','同じ大きさ','全反射','動滑車','音の波','P波・S波','前線通過','示相化石','胎生','両生類','かわらない','グラフ平ら','肺の血管','顕微鏡','葉のエタノール','植物の呼吸','食物連鎖','反射','遺伝3対1','無性生殖'];
if (SHORT.length === T.length) document.getElementById('nav').innerHTML = SHORT.map((s, i) => `<a href="#t${i}">${s}</a>`).join('') + '<a class="chip" href="#challenge">★ ランダム全問チャレンジ</a>';
const list = document.getElementById('list');
T.forEach((d, i) => {
  const stars = '★'.repeat(d.eff) + '☆'.repeat(3 - d.eff);
  const effTxt = ['','ときどき効く','よく効く','ほぼ効く'][d.eff];
  const el = document.createElement('article');
  el.className = 'card'; el.id = 't' + i;
  el.innerHTML = `
    <div class="meta"><span class="tag">${d.tag}</span><span class="eff">効く度 <i>${stars}</i> ${effTxt}</span></div>
    <h2>${d.title}</h2>
    <p class="trick">${d.trick}</p>
    ${d.sub ? `<p class="sub">${d.sub}</p>` : ''}
    <div class="fig">${d.fig}</div>
    ${d.fig2 ? `<p class="figttl">${d.fig2t}</p><div class="fig">${d.fig2}</div>` : ''}
    ${d.skit ? `<div class="skit"><b>コント</b>${d.skit.map(s => `<p><span class="who">${s[0]}</span>「${s[1]}」</p>`).join('')}</div>` : ''}
    ${d.ex ? `<div class="exbox"><b>テストではこう出る</b>${d.ex.map(e => `<p>「${e[0]}」→ <span class="a">${e[1]}</span></p>`).join('')}</div>` : ''}
    <p class="warn">${d.warn}</p>
    <section class="quiz" id="quiz${i}"></section>`;
  list.appendChild(el);
  renderQuiz(i, d.q);
});

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function initChallenge(box){
  const N=T.length;
  let order=[],pos=0,score=0,missed=[],full=true;
  const getBest=()=>{try{return +localStorage.getItem('rika0-best')||0}catch(e){return 0}};
  const setBest=s=>{try{if(s>getBest())localStorage.setItem('rika0-best',String(s))}catch(e){}};
  const goTop=()=>{const rm=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;box.scrollIntoView({block:'start',behavior:rm?'auto':'smooth'});};
  function intro(){
    const b=getBest();
    box.innerHTML=`<span class="lv" style="align-self:flex-start">FINAL</span>
      <h2>ランダム全${N}問チャレンジ！</h2>
      <p class="sub" style="font-size:16px">ここまでの裏技が、1つ1つ問題になって、ランダムな順番で出るよ。全部読んだら挑戦しよう。まちがえた問題は、さいごにもういちど見られる。</p>
      ${b?`<p class="sub">これまでのベスト：${b} / ${N}</p>`:''}
      <div class="btns"><button class="go" id="st">はじめる</button></div>`;
    box.querySelector('#st').addEventListener('click',()=>{start(T.map((_,i)=>i),true);goTop();});
  }
  function start(idx,isFull){order=shuffle(idx);pos=0;score=0;missed=[];full=isFull;ask();}
  function ask(){
    const i=order[pos],q=T[i].q;
    const keep=q.o.some(t=>/^[A-D]$/.test(t)||/^[アイウ]　/.test(t));
    let opts=q.o.map((t,k)=>({t,k}));
    if(!keep)opts=shuffle(opts);
    box.innerHTML=`<div class="chead"><span>第${pos+1}問 / ${order.length}${full?'':'（やり直し）'}</span><span>せいかい ${score}</span></div>
      <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${order.length}" aria-valuenow="${pos}"><i style="width:${pos/order.length*100}%"></i></div>
      <p class="cq" tabindex="-1">${q.t}</p>${q.html?'<div style="overflow-x:auto">'+q.html+'</div>':''}
      <div class="opts">${opts.map(o=>`<button class="opt" data-k="${o.k}">${o.t}</button>`).join('')}</div>
      <div class="res" aria-live="polite"></div>
      <button class="again" id="quit">やめる</button>`;
    box.querySelector('.cq').focus({preventScroll:true});
    box.querySelector('#quit').addEventListener('click',intro);
    box.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{
      const k=+b.dataset.k,ok=k===q.a,last=pos+1>=order.length;
      box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add('ok');else if(x===b)x.classList.add('ng');});
      if(ok)score++;else missed.push(i);
      box.querySelector('.res').innerHTML=`<div class="ans"><span class="v ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん'}</span>　${q.why}</div>
        <div class="btns" style="margin-top:10px"><button class="go" id="nx">${last?'結果を見る':'つぎの問題へ'}</button></div>`;
      const nx=box.querySelector('#nx');
      nx.addEventListener('click',()=>{if(last){finish();}else{pos++;ask();}goTop();});
      nx.focus({preventScroll:true});
    }));
  }
  function finish(){
    const n=order.length,pct=score/n;
    if(full)setBest(score);
    const msg=pct>=.9?'ひきょうな裏技、マスター！':pct>=.7?'かなり使えるよ。まちがえたところの「ただし」を読み直そう。':pct>=.5?'あと少し。まちがえた裏技を見直して、もういちど。':'まずは裏技をもういちど読んでから、また挑戦しよう。';
    const ms=missed.slice().sort((a,b)=>a-b);
    box.innerHTML=`<h2>けっか</h2><p class="big" tabindex="-1">${score} / ${n}</p>
      <div class="prog"><i style="width:${pct*100}%"></i></div><p style="margin:0">${msg}</p>
      ${ms.length?`<div><b>まちがえた問題（もういちど見る）</b><ul class="misslist">${ms.map(i=>`<li><a href="#t${i}">${T[i].title}</a></li>`).join('')}</ul></div>`:'<p style="margin:0">ぜんぶ正解！</p>'}
      ${full&&getBest()?`<p class="sub" style="margin:0">ベスト：${getBest()} / ${N}</p>`:''}
      <div class="btns">${ms.length?'<button class="btn2" id="rm">まちがえた問題だけやり直す</button>':''}<button class="go" id="again2">もういちど（ランダム）</button></div>`;
    box.querySelector('.big').focus({preventScroll:true});
    const rm=box.querySelector('#rm');
    if(rm)rm.addEventListener('click',()=>{start(ms,false);goTop();});
    box.querySelector('#again2').addEventListener('click',()=>{start(T.map((_,i)=>i),true);goTop();});
  }
  intro();
}
const chBox=document.createElement('article');chBox.className='card chal';chBox.id='challenge';list.appendChild(chBox);initChallenge(chBox);

function renderQuiz(i, q) {
  const box = document.getElementById('quiz' + i);
  box.innerHTML = `<span class="qt">練習：この裏技をつかってみよう</span>
    <p>${q.t}</p>${q.html ? '<div style="overflow-x:auto">' + q.html + '</div>' : ''}
    <div class="opts">${q.o.map((t, k) => `<button class="opt" data-k="${k}">${t}</button>`).join('')}</div>
    <div class="res" aria-live="polite"></div>`;
  box.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
    const k = +b.dataset.k, right = k === q.a;
    box.querySelectorAll('.opt').forEach((x, j) => {
      x.disabled = true;
      if (j === q.a) x.classList.add('ok');
      else if (j === k) x.classList.add('ng');
    });
    box.querySelector('.res').innerHTML = `<div class="ans"><span class="v ${right ? 'ok' : 'ng'}">${right ? '正解！' : 'ざんねん'}</span>　${q.why}</div>
      <button class="again">もういちど</button>`;
    box.querySelector('.again').addEventListener('click', () => renderQuiz(i, q));
  }));
}
